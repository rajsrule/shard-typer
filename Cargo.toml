[package]
name = "shard-typer"
version = "0.1.5"
edition = "2024"
rust-version = "1.95"
description = "A small, glassy Windows text typing utility"
license = "MIT"
default-run = "ShardTyper"

[lib]
name = "shard_typer"

[[bin]]
name = "ShardTyper"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "accesskit", "wgpu_no_default_features"] }
wgpu = { version = "30", default-features = false, features = ["dx12"] }
rand = "0.10"
rand_distr = "0.6"
libm = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
rfd = { version = "0.17", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
winit = { version = "0.30", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Foundation", "Graphics_Effects", "System", "UI_Composition", "UI_Composition_Desktop", "Win32_Foundation", "Win32_Graphics_Direct2D_Common", "Win32_System_WinRT", "Win32_System_WinRT_Composition", "Win32_System_WinRT_Graphics_Direct2D"] }
windows-numerics = "=0.3.1"
windows-core = "=0.62.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Security"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

